plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.james090500.pwhitelist'
version = '1.0.0'
description = 'PaperWhitelist'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    // Provided by the Paper server at runtime, same as the Velocity build
    // relied on Velocity's Gson.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    // Not provided by Paper, so it is shaded into the jar.
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
}

tasks {
    shadowJar {
        archiveClassifier.set('')
    }
    build {
        dependsOn shadowJar
    }
}
